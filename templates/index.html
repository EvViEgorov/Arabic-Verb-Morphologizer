<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анализатор арабских глаголов</title>
    <!-- Подключаем Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Анализатор арабских глаголов</h1>
        <form id="verbForm">
            <div class="mb-3">
                <label for="verbInput" class="form-label">Введите форму глагола:</label>
                <input type="text" class="form-control" id="verbInput" name="verb" required>
            </div>
            <button type="submit" class="btn btn-primary">Анализировать</button>
        </form>
        <div id="result" class="mt-4"></div>
    </div>

    <!-- Подключаем Bootstrap JS (необязательно, но может пригодиться) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Наш собственный JS -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
